# Build, test and release (the shape of the OpenRAC mod SDK's workflow, for a mod that is a page
# in the launcher: no library per platform, one archive for every system).
#
# Each push and pull request: the engine built and tested natively on Windows, Linux (x86_64 and
# arm64) and macOS, and as the page's WebAssembly; a test texture upscaled by each with the same
# options, and the PNGs compared byte for byte, so a pack is the same whatever made it; the mod
# packaged as nanotech-upscaler-<version>.zip with SHA256SUMS: the run's artifacts. A tag
# v<version> also publishes them on that release, which is what OpenRAC's launcher installs from
# when a player pastes the repository's address.
#
# Every action is pinned to a commit.
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
  WASI_SDK_SHA256: 52640dde13599bf127a95499e61d6d640256119456d1af8897ab6725bcf3d89c
  # The options the test texture is upscaled with, in the engine's order (src/engine/upscale.hpp).
  SETTINGS: "4|4 1|6 2 0 0 2 1 20 150 30 50 20|3 3 1 0"

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2025
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upscale the test texture
        run: |
          python3 tools/test_texture.py texture.png
          exe=$(find build -name 'nanotech' -o -name 'nanotech.exe' | grep -v CMakeFiles | head -1)
          mkdir out
          i=0
          IFS='|'
          for setting in $SETTINGS; do
            IFS=' '
            # shellcheck disable=SC2086 # the option values are words
            "$exe" texture.png "out/$i.png" $setting
            i=$((i + 1))
            IFS='|'
          done
          (cd out && sha256sum -- *.png | tr -d '*' > "../sums-$NAME.txt")
          cat "sums-$NAME.txt"
        env:
          NAME: ${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.name }}
          path: sums-${{ matrix.name }}.txt
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: wasi-sdk
        run: |
          curl -sSfL -o wasi-sdk.tar.gz "$WASI_SDK_URL"
          echo "$WASI_SDK_SHA256  wasi-sdk.tar.gz" | sha256sum -c -
          mkdir wasi-sdk && tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWASI_SDK_PREFIX="$PWD/wasi-sdk" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/wasi-sdk/share/cmake/wasi-sdk.cmake"
      - name: Build
        run: cmake --build build --parallel
      - name: Test (in Node)
        run: ctest --test-dir build --output-on-failure
      - name: Upscale the test texture
        run: |
          python3 tools/test_texture.py texture.png
          mkdir out
          i=0
          IFS='|'
          for setting in $SETTINGS; do
            IFS=' '
            # shellcheck disable=SC2086 # the option values are words
            node tools/nanotech.mjs build/nanotech.wasm texture.png "out/$i.png" $setting
            i=$((i + 1))
            IFS='|'
          done
          (cd out && sha256sum -- *.png > ../sums-wasm.txt)
          cat sums-wasm.txt
      - name: Networks
        # Real-ESRGAN's and PLKSR-Rep's weights, each checked against its pinned SHA-256.
        run: python3 tools/fetch_models.py --cache build/weights
      - name: Package
        run: |
          python3 tools/package.py build/nanotech.wasm -o dist
          (cd dist && sha256sum -- *.zip > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-wasm
          path: sums-wasm.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # The same PNGs from every system and from the page's WebAssembly.
  same-bytes:
    needs: [native, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          merge-multiple: true
      - name: Compare
        run: |
          status=0
          for sums in sums-*.txt; do
            if ! diff -u sums-wasm.txt "$sums"; then
              echo "::error::$sums: other bytes than the WebAssembly's"
              status=1
            fi
          done
          exit $status

  # A tag: the archive and SHA256SUMS on the tag's release, published, for the launcher.
  release:
    needs: [wasm, same-bytes]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          printf 'Built by the build workflow from %s.\n\nInstall: paste this repository'"'"'s address in the OpenRAC launcher'"'"'s Mods tab, or add the .zip there.\n' \
            "$GITHUB_SHA" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag dist/*
          fi
